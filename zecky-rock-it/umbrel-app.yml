manifestVersion: 1
id: zecky-rock-it
storage:
  dataRoot: data
category: finance
name: Zecky Rock it
version: "0.3.14"
tagline: Your own Zcash node for Zecky Lock it and Zecky Pocket
icon: https://raw.githubusercontent.com/zeckyapp/rock-it/main/status/icon.svg
description: >-
  Needs about 300 GB of free disk space. The first sync downloads and checks
  the whole Zcash chain, which takes several days on a Raspberry Pi 5.


  Rock it runs a Zcash node on your Umbrel, with a light-wallet server in front
  of it. Point Zecky Lock it and Zecky Pocket at it, and your wallets ask your
  own node about the chain instead of someone else's server.


  The app opens to a status page that shows how far the sync is, the address
  to enter in Zecky, and a code to pair the Rock it iPhone app. The node only
  connects out, so nobody can find it from the internet. The wallet port
  (8137) is only open on your home network. With Tailscale on, one encrypted
  address works for every wallet, at home and away. Use Rock it on your own
  home network, or through Tailscale anywhere else.


  Powered by Zakura (a Zcash node based on Zebra) and Zaino (a light-wallet
  server by Zingo Labs), with two small Rock it patches for speed on a
  Raspberry Pi.
releaseNotes: >-
  0.3.14: Zakura 1.7.0, ready for the NU7 network upgrade (around 5 November).
  Update before 29 October: older versions stop around 1 November. Your node
  keeps its data, so there is no new sync.


  0.3.13: a smoother first start on a new Umbrel: the Tailscale folder is
  ready from the first second.


  0.3.12: a clear note on the Connect card: use the home address only on your
  own Wi-Fi, and the encrypted Tailscale address anywhere else.


  0.3.11: the widget tiles fit: Shielded shows its share of all ZEC, and
  Wallets says Ready.


  0.3.10: one Connect card. With Tailscale on, one address works for every
  wallet and the Rock it app, at home and away, and a QR code gives your
  wallets the server address. Without Tailscale, your home Wi-Fi address and
  pairing work as before.


  0.3.9: optional: use other wallets like Zodl and Vizor with your Rock,
  encrypted through Tailscale. Off by default; turn it on on the Rock it page.


  0.3.8: Rock it limits how many connections it takes at once, so no device
  on your network can tie it up.


  0.3.7: two home-screen widgets: your Zcash node's sync, and four tiles on
  shielded ZEC, peers, wallets and mode.


  0.3.6: the home-screen widget shows the sync again, and the page is now
  out of reach of other apps entirely. The base images are pinned to their
  exact builds.


  0.3.5: other apps on your Umbrel can no longer reach Rock it. The node and
  Zaino run on Rock it's own network, and the status page only answers
  Umbrel itself, behind its login.


  0.3.4: the iPhone app's encrypted connection now requires TLS 1.3.


  0.3.3: the status page image is pinned to its exact build.


  0.3.2: the page says clearly which address is for the Rock it iPhone app
  and which is for Lock it and Pocket.


  0.3.1: fixes "The encrypted connection is not ready" after updating; Rock it
  now sets up its own data folder.


  0.3.0: the Rock it iPhone app now talks to your Rock over an encrypted connection
  (HTTPS on port 8139) with your Rock's own certificate. The QR code carries
  its fingerprint, so the app trusts your Rock and nothing else. Update the
  iPhone app to 0.3.0 and pair it again.

developer: Zecky
website: https://zecky.app
dependencies: []
repo: https://github.com/zeckyapp/rock-it
support: https://github.com/zeckyapp/rock-it/issues

port: 8138
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "30s"
    endpoint: "status:8080/api/widget"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Zcash node"
      text: "42.0%"
      progressLabel: "Syncing · block 1,480,000 of 3,520,000"
      progress: 0.42
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "status:8080/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Shielded"
          text: "29%"
          subtext: "of ZEC"
        - title: "Network"
          text: "52"
          subtext: "peers"
        - title: "Wallets"
          text: "Ready"
          subtext: ""
        - title: "Mode"
          text: "Private"
          subtext: "node"

backupIgnore:
  - data/zakura/*
  - data/zaino/*

submitter: Zecky
submission: https://github.com/zeckyapp/rock-it
