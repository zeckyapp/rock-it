version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zecky-rock-it_status_1
      APP_PORT: 8080
      # Everything on this port stays behind the Umbrel login. The iPhone app
      # uses its own HTTPS port (8139) instead.

  # Status and connection page (the app's web UI and home-screen widget).
  status:
    # The digest pins the exact build (the Status image workflow reports it).
    image: ghcr.io/zeckyapp/rockit-status:0.3.8@sha256:17ad74e4b51e8f76b9245e6f256db68700f14210add401de773e2cec3bb0b0be
    # Starts as root only to give its data folder to user 1000 (Docker makes a
    # missing folder owned by root), then drops to 1000 before serving.
    user: "0:0"
    restart: on-failure
    environment:
      ZAKURA_RPC: "http://${APP_ZECKY_ROCK_IT_ZAKURA_IP}:8232"
      ZAINO_ADDR: "${APP_ZECKY_ROCK_IT_ZAINO_IP}:${APP_ZECKY_ROCK_IT_WALLET_PORT}"
      WALLET_PORT: "${APP_ZECKY_ROCK_IT_WALLET_PORT}"
      APP_VERSION: "${APP_VERSION}"
      DATA_DIR: /chain
      PAIR_DIR: /data
      TLS_PORT: "${APP_ZECKY_ROCK_IT_PHONE_PORT}"
      # The node's peer port (8233) is not published: it only connects out.
      NODE_INBOUND: "false"
      # Only Umbrel itself may use the page on 8080: the host's address on
      # Rock it's own network. Anything else gets 403.
      PAGE_CLIENTS: "10.137.42.1"
      # Other wallets (Zodl, Vizor, ...): the Tailscale service below, off
      # until the owner turns it on on the page.
      TS_SOCKET: /tailscale/tailscaled.sock
      TS_DIR: /tailscale
    ports:
      # The Rock it iPhone app, HTTPS with the Rock's own certificate. Only
      # pairing and the status (with a paired key) answer here.
      - "${APP_ZECKY_ROCK_IT_PHONE_PORT}:${APP_ZECKY_ROCK_IT_PHONE_PORT}"
    volumes:
      # Paired iPhones (key hashes only) and the HTTPS certificate.
      - ${APP_DATA_DIR}/data/rockit:/data
      # Read-only, only to show the free space on the drive.
      - ${APP_DATA_DIR}/data/zakura:/chain:ro
      # Tailscale's state and control socket (other wallets). The status page
      # gives it to user 1000 on start, like its own folder.
      - ${APP_DATA_DIR}/data/tailscale:/tailscale
    networks:
      # Only Rock it's own network. Umbrel (on the host) still reaches the
      # page and the widget here; other apps cannot reach it at all. It must
      # stay on exactly one network: Umbrel finds the widget's address with
      # docker inspect, which glues the addresses of all networks together.
      rockit: {}

  # The Zcash node.
  # Zakura publishes only "latest"; the digest pins the exact 1.6.0 build.
  # Runs as root at first: its entrypoint gives the data folder to its own
  # user (10001) and then drops to that user.
  zakura:
    image: docker.io/zakuracore/zakura:latest@sha256:bf53c178e9549217fce7cfaa21efc85c478129ba6dc5307d55640514affeb0ac
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # RPC for Zaino and the status page. It has no password, so it is only
      # on Rock it's own network: other Umbrel apps cannot reach it.
      ZAKURA_RPC__LISTEN_ADDR: "0.0.0.0:8232"
      ZAKURA_RPC__ENABLE_COOKIE_AUTH: "false"
    volumes:
      - ${APP_DATA_DIR}/data/zakura:/home/zebra/.cache/zakura
    networks:
      rockit:
        ipv4_address: $APP_ZECKY_ROCK_IT_ZAKURA_IP

  # Light-wallet server: Zecky Lock it and Pocket connect here.
  zaino:
    image: ghcr.io/zeckyapp/zaino-rockit:0.10.2-rockit2@sha256:910eef16363add186db34c11ccd6d27f880bf15a041835431a28e0dae8d55747
    restart: on-failure
    depends_on:
      - zakura
    volumes:
      - ${APP_DATA_DIR}/zainod.toml:/app/config/zainod.toml:ro
      - ${APP_DATA_DIR}/data/zaino:/app/data
    ports:
      # Open to the home network for Lock it and Pocket, as before.
      - "${APP_ZECKY_ROCK_IT_WALLET_PORT}:${APP_ZECKY_ROCK_IT_WALLET_PORT}"
    networks:
      rockit:
        ipv4_address: $APP_ZECKY_ROCK_IT_ZAINO_IP

  # Other wallets (Zodl, Vizor, ...): the Rock's own Tailscale node. Logged
  # out and serving nothing until the owner turns it on on the page; then it
  # serves only HTTPS on 9067 in front of Zaino, inside the owner's tailnet.
  # tailscaled runs directly (Tailscale's start script stops when nobody logs
  # in within a minute), as user 1000 so the status page may drive it, in
  # userspace mode so it needs no root or network device.
  tailscale:
    image: docker.io/tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - status
    entrypoint:
      - tailscaled
      - --tun=userspace-networking
      - --state=/var/lib/tailscale/tailscaled.state
      - --socket=/var/lib/tailscale/tailscaled.sock
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
    networks:
      rockit: {}

# Rock it's own network: only its containers are on it, so other Umbrel apps
# cannot reach the node's RPC or Zaino directly. Zakura still connects out to
# other Zcash nodes through it.
networks:
  rockit:
    ipam:
      config:
        - subnet: 10.137.42.0/24
          gateway: 10.137.42.1
