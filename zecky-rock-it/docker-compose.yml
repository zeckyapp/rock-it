version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zecky-rock-it_status_1
      APP_PORT: 8080
      # Only the Rock it iPhone app's paths skip the Umbrel login: /phone/pair
      # (needs the code from the page) and /phone/status (needs the key from
      # pairing). The page and /api/* stay behind the login.
      PROXY_AUTH_WHITELIST: "/phone/*"

  # Status and connection page (the app's web UI and home-screen widget).
  status:
    # Pin to the digest once the 0.2.0 image is built (Status image workflow).
    image: ghcr.io/zeckyapp/rockit-status:0.2.0
    user: "1000:1000"
    restart: on-failure
    environment:
      ZAKURA_RPC: "http://${APP_ZECKY_ROCK_IT_ZAKURA_IP}:8232"
      ZAINO_ADDR: "${APP_ZECKY_ROCK_IT_ZAINO_IP}:${APP_ZECKY_ROCK_IT_WALLET_PORT}"
      WALLET_PORT: "${APP_ZECKY_ROCK_IT_WALLET_PORT}"
      APP_VERSION: "${APP_VERSION}"
      DATA_DIR: /chain
      PAIR_DIR: /data
      # The node's peer port (8233) is not published: it only connects out.
      NODE_INBOUND: "false"
    volumes:
      # Paired iPhones (key hashes only).
      - ${APP_DATA_DIR}/data/rockit:/data
      # Read-only, only to show the free space on the drive.
      - ${APP_DATA_DIR}/data/zakura:/chain:ro

  # The Zcash node.
  # Zakura publishes only "latest"; the digest pins the exact 1.6.0 build.
  # Runs as root at first: its entrypoint gives the data folder to its own
  # user (10001) and then drops to that user.
  zakura:
    image: docker.io/zakuracore/zakura:latest@sha256:bf53c178e9549217fce7cfaa21efc85c478129ba6dc5307d55640514affeb0ac
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # RPC for Zaino and the status page. Not published outside Docker.
      ZAKURA_RPC__LISTEN_ADDR: "0.0.0.0:8232"
      ZAKURA_RPC__ENABLE_COOKIE_AUTH: "false"
    volumes:
      - ${APP_DATA_DIR}/data/zakura:/home/zebra/.cache/zakura
    networks:
      default:
        ipv4_address: $APP_ZECKY_ROCK_IT_ZAKURA_IP

  # Light-wallet server: Zecky Lock it and Pocket connect here.
  zaino:
    image: ghcr.io/zeckyapp/zaino-rockit:0.10.2-rockit1@sha256:3abdb522b5296871fb53ce5897f72886ebf42b2ffc93890b1ad02e4d075172be
    restart: on-failure
    depends_on:
      - zakura
    volumes:
      - ${APP_DATA_DIR}/zainod.toml:/app/config/zainod.toml:ro
      - ${APP_DATA_DIR}/data/zaino:/app/data
    ports:
      - "${APP_ZECKY_ROCK_IT_WALLET_PORT}:${APP_ZECKY_ROCK_IT_WALLET_PORT}"
    networks:
      default:
        ipv4_address: $APP_ZECKY_ROCK_IT_ZAINO_IP
